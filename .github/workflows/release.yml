name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Squirrel orders installs by version. A tag published under a package
      # version that does not match would be ignored by installed apps at
      # best and roll them backwards at worst, so refuse before building.
      - name: Check the tag matches apps/operator's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./apps/operator/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match apps/operator/package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # forge.config.ts copies apps/web/dist into the app as an extra
      # resource; without this step the packaged server has no attendee app.
      - run: pnpm --filter @simul/web build

      - name: Build and publish the Windows installer
        run: pnpm --filter @simul/operator exec electron-forge publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
